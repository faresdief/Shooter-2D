/* ------------------------------ helpers ------------------------------ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
const mixRGB = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';

function sample(kfs, t) {                       // linear keyframes, clamped
  if (t <= kfs[0][0]) return kfs[0][1];
  for (let i = 1; i < kfs.length; i++) {
    if (t <= kfs[i][0]) {
      const a = kfs[i - 1], b = kfs[i];
      return a[1] + (b[1] - a[1]) * ((t - a[0]) / (b[0] - a[0]));
    }
  }
  return kfs[kfs.length - 1][1];
}

/* smooth 1-D value noise for the camera shake */
const noiseSeed = [Math.random() * 1000, Math.random() * 1000];
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return (s - Math.floor(s)) * 2 - 1; }
function vnoise(x) {
  const i = Math.floor(x), f = x - i, u = f * f * f * (f * (f * 6 - 15) + 10);
  return (hash(i) + (hash(i + 1) - hash(i)) * u) * 0.7;
}
